# 复制成 mend.toml 使用（`mend init` 会自动生成）。
# 注意：密钥不写在这里，只从环境变量读，避免误提交。

model = "deepseek-chat"                     # qwen-max / glm-4-plus / kimi / gpt-4o-mini 都行（OpenAI 兼容）
base_url = "https://api.deepseek.com/v1"
api_key_env = "MEND_API_KEY"

max_steps = 25                              # 步数上限：超了就带着现状停下，交给人
timeout_s = 60                              # 单条命令超时（秒）
test_command = ""                           # 留空 = 自动探测 pytest / npm test / go test / cargo test

# 命令白名单：只允许跑这些可执行文件（第一段命令名匹配）
allowed_commands = ["pytest", "python", "python3", "pip", "npm", "node", "npx", "go", "cargo", "make", "ruff", "mypy", "tsc", "eslint"]

# 这些目录一律不可读不可写：.git 会破坏仓库，.env 会泄露密钥，缓存目录是噪音
forbidden_paths = [".git", ".env", ".venv", "venv", "node_modules", ".mend", "__pycache__", ".pytest_cache", ".ruff_cache", ".mypy_cache", ".tox", ".idea", ".vscode"]

# 测试文件在工具层不可写（结尾带 / 表示目录，其余按文件名 glob 匹配）。
# 这是"禁止改测试来让测试变绿"的结构保证，不依赖提示词。
# 注意：默认不保护 pytest.ini / pyproject.toml 这类配置文件，因为 agent 经常要合法地
# 改它们（加依赖、改打包配置）；想更严就自己加进去。
protected_paths = ["tests/", "spec/", "test_*.py", "*_test.py", "*_test.go", "conftest.py"]
